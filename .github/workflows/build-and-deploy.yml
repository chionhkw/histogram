name: Build teleproto bundle and deploy

# Runs on every push to main. Rebuilds vendor/teleproto.bundle.js from the
# pinned version in build/package.json and commits it if it changed, so the
# site never fetches teleproto live from a third-party CDN at request time.
# The bundle only changes when you deliberately bump the version in
# build/package.json and push - not on every visitor's page load.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install build deps
        working-directory: build
        run: npm install

      - name: Build bundle
        working-directory: build
        run: npm run build --if-present

      - name: Commit bundle if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild teleproto bundle [skip ci]"
          file_pattern: 'vendor/teleproto.bundle.js'

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v6
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
